<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel">
<meta name="theme-color" content="#0f1115">
<title>Fuel</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;
  --accent:#16a34a;--accent-text:#fff;--prot:#2563eb;--kcal:#f59e0b;--danger:#dc2626;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#1a1d24;--text:#f1f3f5;--muted:#9aa3b2;--line:#2a2f3a;--accent:#22c55e;--accent-text:#04210f;--prot:#60a5fa;--kcal:#fbbf24;--danger:#f87171}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
header h1{font-size:20px;margin:0}
.icon{background:none;border:0;font-size:22px;padding:6px 10px;border-radius:10px}
.icon:active{background:var(--line)}
.stat .top{display:flex;justify-content:space-between;align-items:baseline}
.stat b{font-size:26px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar:last-child{margin-bottom:0}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent;font-size:17px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.meal .items{margin:8px 0 0;padding:0;list-style:none}
.meal .items li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;color:var(--muted)}
.meal h3{margin:0;font-size:16px}
.meal .tot{font-size:13px;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px max(24px,env(safe-area-inset-bottom))}
.panel h2{margin:0;font-size:18px}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:12px 0}
input[type=text],input[type=number],input[type=password]{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.item{display:grid;grid-template-columns:1fr 64px 64px 28px;gap:6px;align-items:center;margin-bottom:8px}
.item .nm{grid-column:1/-1}
.item .x{background:none;border:0;color:var(--danger);font-size:18px}
.hdr{display:grid;grid-template-columns:1fr 64px 64px 28px;gap:6px;font-size:12px;color:var(--muted);margin-top:12px}
.hdr span:nth-child(n+2){text-align:center}
.err{color:var(--danger);font-size:14px;margin:8px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header>
  <button class="icon" id="prev" aria-label="Previous day">‹</button>
  <div style="text-align:center"><h1 id="dayLabel">Today</h1><div class="muted" id="dayDate"></div></div>
  <div class="row"><button class="icon" id="next" aria-label="Next day">›</button><button class="icon" id="openSettings" aria-label="Settings">⚙︎</button></div>
</header>

<div class="card stat">
  <div class="top"><span class="muted">Calories</span><span><b id="kcalNow">0</b> <span class="muted">/ <span id="kcalGoal">0</span></span></span></div>
  <div class="bar"><i id="kcalBar" style="background:var(--kcal);width:0"></i></div>
  <div class="top"><span class="muted">Protein</span><span><b id="protNow">0</b> <span class="muted">/ <span id="protGoal">0</span> g</span></span></div>
  <div class="bar"><i id="protBar" style="background:var(--prot);width:0"></i></div>
</div>

<div class="actions">
  <button class="btn primary" id="scanBtn">📷 Scan food</button>
  <button class="btn" id="manualBtn">+ Manual</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<div id="meals"></div>

<!-- Add / scan sheet -->
<div class="sheet" id="addSheet"><div class="panel">
  <div class="row between"><h2 id="addTitle">Scan food</h2><button class="icon" data-close>✕</button></div>
  <div id="scanPart">
    <img id="preview" class="preview" alt="">
    <label for="note">Note for the scan (optional)</label>
    <input type="text" id="note" placeholder="e.g. 200g chicken, cooked in olive oil">
    <button class="btn primary" id="analyze" style="width:100%;margin-top:12px">Analyze</button>
    <div class="err" id="scanErr"></div>
  </div>
  <div id="resultPart" hidden>
    <label for="mealName">Meal name</label>
    <input type="text" id="mealName" placeholder="Lunch">
    <div class="hdr"><span>Item</span><span>kcal</span><span>protein</span><span></span></div>
    <div id="itemRows" style="margin-top:6px"></div>
    <button class="btn" id="addRow" style="width:100%;padding:8px">+ Add item</button>
    <div class="row between" style="margin:14px 0 4px"><b>Total</b><b id="sheetTotal"></b></div>
    <button class="btn primary" id="saveMeal" style="width:100%;margin-top:8px">Add to log</button>
  </div>
</div></div>

<!-- Settings sheet -->
<div class="sheet" id="setSheet"><div class="panel">
  <div class="row between"><h2>Settings</h2><button class="icon" data-close>✕</button></div>
  <label for="goalK">Daily calories goal</label><input type="number" id="goalK" inputmode="numeric">
  <label for="goalP">Daily protein goal (g)</label><input type="number" id="goalP" inputmode="numeric">
  <label for="apiKey">Gemini API key (free)</label>
  <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
  <div class="muted" style="margin-top:6px">Get a free key at aistudio.google.com → Get API key. Stored only in this browser, never uploaded to GitHub. Type <code>demo</code> to try fake scans without a key.</div>
  <label for="model">Model</label><input type="text" id="model">
  <button class="btn primary" id="saveSet" style="width:100%;margin-top:16px">Save</button>
  <div class="grid2" style="margin-top:16px">
    <button class="btn" id="exportBtn">Export data</button>
    <button class="btn" id="importBtn">Import data</button>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>
  <button class="btn danger" id="wipe" style="width:100%;margin-top:10px">Delete all data</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Math.max(0, Math.round(parseFloat(v) || 0));

// ---- storage (every access guarded) ----
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
let data = store.get("fuel.data", { goals:{kcal:2200, protein:150}, meals:[], model:"gemini-2.5-flash" });
let apiKey = store.get("fuel.key", "");
const save = () => store.set("fuel.data", data);
const DEFAULT_MODEL = "gemini-2.5-flash";
const modelName = () => (!data.model || /claude/i.test(data.model)) ? DEFAULT_MODEL : data.model;

// ---- day navigation ----
const dkey = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
let day = new Date();
const todayKey = () => dkey(new Date());

function render(){
  const k = dkey(day);
  const isToday = k === todayKey();
  $("dayLabel").textContent = isToday ? "Today" : (k === dkey(new Date(Date.now()-864e5)) ? "Yesterday" : "Log");
  $("dayDate").textContent = day.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  $("next").style.visibility = isToday ? "hidden" : "visible";
  const meals = data.meals.filter(m => m.date === k).sort((a,b)=>b.ts-a.ts);
  const sum = f => meals.reduce((a,m)=>a+m.items.reduce((b,i)=>b+i[f],0),0);
  const kc = sum("kcal"), pr = sum("protein");
  $("kcalNow").textContent = kc; $("protNow").textContent = pr;
  $("kcalGoal").textContent = data.goals.kcal; $("protGoal").textContent = data.goals.protein;
  $("kcalBar").style.width = Math.min(100, kc/(data.goals.kcal||1)*100) + "%";
  $("protBar").style.width = Math.min(100, pr/(data.goals.protein||1)*100) + "%";
  $("meals").innerHTML = meals.length ? meals.map(m => {
    const mk = m.items.reduce((a,i)=>a+i.kcal,0), mp = m.items.reduce((a,i)=>a+i.protein,0);
    return `<div class="card meal"><div class="row between"><h3>${esc(m.name)}</h3><span class="tot">${mk} kcal · ${mp} g protein</span></div>
      <ul class="items">${m.items.map(i=>`<li><span>${esc(i.name)}</span><span>${i.kcal} · ${i.protein}g</span></li>`).join("")}</ul>
      <button class="del" data-del="${m.id}">Delete</button></div>`;
  }).join("") : `<div class="card empty muted">Nothing logged yet.<br>Tap “Scan food” to snap your meal.</div>`;
}
$("prev").onclick = () => { day = new Date(day.getTime() - 864e5); render(); };
$("next").onclick = () => { day = new Date(day.getTime() + 864e5); render(); };
$("meals").onclick = e => {
  const id = e.target.dataset.del;
  if (id && confirm("Delete this meal?")) { data.meals = data.meals.filter(m => m.id !== id); save(); render(); }
};

// ---- sheets ----
const open = id => $(id).classList.add("open");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest(".sheet").classList.remove("open"));
document.querySelectorAll(".sheet").forEach(s => s.addEventListener("click", e => { if (e.target === s) s.classList.remove("open"); }));

// ---- add meal sheet ----
let items = [], imgData = null;
function showResult(name){
  $("scanPart").hidden = true; $("resultPart").hidden = false;
  $("mealName").value = name || "";
  drawRows(); open("addSheet");
}
function drawRows(){
  $("itemRows").innerHTML = items.map((it,i)=>`<div class="item">
    <input class="nm" type="text" value="${esc(it.name)}" data-i="${i}" data-f="name" placeholder="Food">
    <input type="number" inputmode="numeric" value="${it.kcal}" data-i="${i}" data-f="kcal" style="grid-column:2">
    <input type="number" inputmode="numeric" value="${it.protein}" data-i="${i}" data-f="protein">
    <button class="x" data-rm="${i}" aria-label="Remove">✕</button></div>`).join("");
  // portion hint under name
  document.querySelectorAll("#itemRows .item").forEach((el,i)=>{
    if (items[i].portion) { const p = document.createElement("div"); p.className="muted"; p.style.cssText="grid-column:1/-1;margin-top:-4px;font-size:12px"; p.textContent = items[i].portion; el.insertBefore(p, el.children[1]); }
  });
  totals();
}
function totals(){
  $("sheetTotal").textContent = `${items.reduce((a,i)=>a+i.kcal,0)} kcal · ${items.reduce((a,i)=>a+i.protein,0)} g`;
}
$("itemRows").oninput = e => {
  const t = e.target, i = t.dataset.i; if (i == null) return;
  items[i][t.dataset.f] = t.dataset.f === "name" ? t.value : num(t.value);
  totals();
};
$("itemRows").onclick = e => { const r = e.target.dataset.rm; if (r != null) { items.splice(+r,1); drawRows(); } };
$("addRow").onclick = () => { items.push({name:"",portion:"",kcal:0,protein:0}); drawRows(); };
$("saveMeal").onclick = () => {
  const clean = items.filter(i => i.name.trim() || i.kcal || i.protein).map(i => ({name:i.name.trim()||"Item", kcal:num(i.kcal), protein:num(i.protein)}));
  if (!clean.length) return;
  const k = dkey(day);
  data.meals.push({id:String(Date.now()), date:k, ts:Date.now(), name:$("mealName").value.trim()||"Meal", items:clean});
  save(); render(); $("addSheet").classList.remove("open");
};
$("manualBtn").onclick = () => { items = [{name:"",portion:"",kcal:0,protein:0}]; $("addTitle").textContent = "Add manually"; showResult(""); };

// ---- scanning ----
$("scanBtn").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { imgData = await shrink(f); } catch { alert("Couldn't read that image."); return; }
  $("addTitle").textContent = "Scan food";
  $("preview").src = "data:image/jpeg;base64," + imgData;
  $("note").value = ""; $("scanErr").textContent = "";
  $("scanPart").hidden = false; $("resultPart").hidden = true;
  setAnalyze(false); open("addSheet");
};
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", .85).split(",")[1]);
    };
    img.onerror = rej; img.src = url;
  });
}
function setAnalyze(busy){
  $("analyze").disabled = busy;
  $("analyze").innerHTML = busy ? '<span class="spin"></span>Analyzing…' : "Analyze";
}
const PROMPT = `You are a nutrition estimator. Identify each distinct food or drink in this photo, estimate its portion size, and estimate calories (kcal) and protein (grams) for that portion. Be realistic, and account for visible cooking oil, sauces and so on. Respond with ONLY JSON, no prose, in exactly this shape:
{"meal":"short meal name","items":[{"name":"food","portion":"e.g. ~150 g","kcal":0,"protein":0}]}`;
$("analyze").onclick = async () => {
  $("scanErr").textContent = "";
  if (!apiKey) { $("scanErr").textContent = "Add your API key in Settings (⚙︎) first."; return; }
  setAnalyze(true);
  try {
    let out;
    if (apiKey === "demo") {
      await new Promise(r => setTimeout(r, 900));
      out = {meal:"Chicken rice bowl", items:[
        {name:"Grilled chicken breast",portion:"~150 g",kcal:248,protein:46},
        {name:"White rice",portion:"~1 cup",kcal:205,protein:4},
        {name:"Broccoli",portion:"~80 g",kcal:27,protein:2},
        {name:"Olive oil",portion:"~1 tbsp",kcal:119,protein:0}]};
    } else {
      const note = $("note").value.trim();
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName()}:generateContent`, {
        method:"POST",
        headers:{"content-type":"application/json","x-goog-api-key":apiKey},
        body: JSON.stringify({
          contents:[{parts:[
            {text: PROMPT + (note ? `\n\nUser note about the meal (trust this for portions/ingredients): ${note}` : "")},
            {inline_data:{mime_type:"image/jpeg",data:imgData}}]}],
          generationConfig:{responseMimeType:"application/json", temperature:0.2}
        })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
      const txt = (j.candidates?.[0]?.content?.parts||[]).map(b => b.text||"").join("");
      if (!txt) throw new Error("The model returned no answer. Try another photo.");
      const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error("Unexpected response from the model.");
      out = JSON.parse(m[0]);
    }
    items = (out.items||[]).map(i => ({name:String(i.name||""), portion:String(i.portion||""), kcal:num(i.kcal), protein:num(i.protein)}));
    if (!items.length) throw new Error("No food detected. Try a clearer photo.");
    showResult(out.meal || "");
  } catch (err) {
    $("scanErr").textContent = err.message || "Something went wrong.";
  } finally { setAnalyze(false); }
};

// ---- settings ----
$("openSettings").onclick = () => {
  $("goalK").value = data.goals.kcal; $("goalP").value = data.goals.protein;
  $("apiKey").value = apiKey; $("model").value = modelName();
  open("setSheet");
};
$("saveSet").onclick = () => {
  data.goals.kcal = num($("goalK").value) || 2200; data.goals.protein = num($("goalP").value) || 150;
  data.model = $("model").value.trim() || DEFAULT_MODEL;
  apiKey = $("apiKey").value.trim(); store.set("fuel.key", apiKey);
  save(); render(); $("setSheet").classList.remove("open");
};
$("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download = `fuel-backup-${todayKey()}.json`; a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.meals) || !j.goals) throw 0;
    if (confirm("Replace current data with this backup?")) { data = j; save(); render(); $("setSheet").classList.remove("open"); }
  } catch { alert("That isn't a valid Fuel backup."); }
};
$("wipe").onclick = () => {
  if (confirm("Delete ALL meals and settings on this device?")) {
    store.del("fuel.data"); store.del("fuel.key"); location.reload();
  }
};

render();
</script>
</body>
</html>
